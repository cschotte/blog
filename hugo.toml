title = "Clemens Schotte"
baseURL = "https://clemens.ms"

defaultContentLanguage = "en"

[languages.en]
label = "English"
locale = "en-US"

copyright = "Copyright by Clemens Schotte."

enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

[pagination]
  pagerSize = 12
  path = "page"

[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
  [[menu.main]]
    weight = 4
    identifier = "about"
    name = "About"
    url = "/about/"

[params]
  title = "Clemens Schotte"
  tagline = "Software engineering, cloud, and retro computing"
  description = "Clemens Schotte's personal technical blog about Azure, AI, software engineering, and retro computing."
  image = "/icons/logo.png"
  since = 2020

  [params.author]
    name = "Clemens Schotte"
    email = "clemens@navatron.com"

  [params.home]
    avatar = "/images/clemens.jpg"
    title = "Hi! I'm Clemens Schotte,"
    subtitle = "Enthusiastic storyteller with a passion for technology"
    paginate = 6

  [params.giscus]
    repo = "cschotte/Blog"
    repoId = "MDEwOlJlcG9zaXRvcnkyNjQxNDAwNjE="
    category = "General"
    categoryId = "DIC_kwDOD751Hc4Ctzrh"

  [params.analytics]
    googleId = "G-4RSBDP58C3"
    clarityId = "8k4z1elga6"

[privacy]
  [privacy.youtube]
    privacyEnhanced = true

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      attribute = true
      autoHeadingID = true
      autoHeadingIDType = "github"
      wrapStandAloneImageWithinParagraph = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[permalinks]
  posts = ":contentbasename"

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]
  [mediaTypes."text/x-llms"]
    suffixes = ["txt"]

[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

[outputFormats.LLMS]
  mediaType = "text/x-llms"
  baseName = "llms"
  isPlainText = true
  isHTML = false
  notAlternative = true

[outputFormats.LLMSFULL]
  mediaType = "text/x-llms"
  baseName = "llms-full"
  isPlainText = true
  isHTML = false
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS", "LLMSFULL", "ROBOTS"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[security]
  enableInlineShortcodes = false
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$']
    osEnv = ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$']
  [security.funcs]
    getenv = ['^HUGO_']
  [security.http]
    methods = ['(?i)GET|POST']
    urls = ['.*']

[frontmatter]
  date = [":default", ":filename", ":fileModTime"]
  lastmod = ["lastmod", ":default"]
  publishDate = [":default", ":filename", ":fileModTime"]
  expiryDate = [":default"]

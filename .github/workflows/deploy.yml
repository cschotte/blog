name: Build and Deploy Hugo site to Azure Blob Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      HUGO_VERSION: 0.162.1
      AZURE_STORAGE_ACCOUNT: clemens
      AZURE_FRONT_DOOR_RESOURCE_GROUP: rg-navatron-website-prod-we
      AZURE_FRONT_DOOR_PROFILE_NAME: navatron
      AZURE_FRONT_DOOR_ENDPOINT_NAME: clemens

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for Hugo's .GitInfo

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ env.HUGO_VERSION }}
        extended: true

    - name: Cache Hugo modules
      uses: actions/cache@v4
      with:
        path: /tmp/hugo_cache
        key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-hugomod-

    - name: Build the website
      run: |
        hugo --minify --gc --environment production
      env:
        HUGO_CACHEDIR: /tmp/hugo_cache

    - name: Verify build integrity
      run: |
        # Check if critical files exist
        test -f public/index.html || exit 1
        test -f public/sitemap.xml || exit 1
        # Verify no sensitive files are included
        find public -name "*.env" -o -name "*.key" -o -name "*.pem" | grep . && exit 1 || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: hugo-public
        path: public/
        retention-days: 7

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Upload to Azure Blob Storage
      uses: azure/cli@v2
      with:
        inlineScript: |
          az storage blob upload-batch \
            --account-name ${{ env.AZURE_STORAGE_ACCOUNT }} \
            --auth-mode login \
            --destination \$web \
            --source ./public \
            --overwrite \
            --pattern "*" \
            --content-cache-control "public, max-age=3600" \
            --verbose

    - name: Purge Azure Front Door
      uses: azure/cli@v2
      with:
        inlineScript: |
          if ! az afd endpoint purge \
            --resource-group ${{ env.AZURE_FRONT_DOOR_RESOURCE_GROUP }} \
            --profile-name ${{ env.AZURE_FRONT_DOOR_PROFILE_NAME }} \
            --endpoint-name ${{ env.AZURE_FRONT_DOOR_ENDPOINT_NAME }} \
            --content-paths "/*" \
            --verbose; then
            echo "::warning::Azure Front Door purge failed. The site was uploaded, but cached content may take longer to refresh."
          fi

projects:
  - name: CaveRace
    summary: >
      CaveRace is a classic maze-based video game Clemens developed in 1997 with other
      students. The MS-DOS version was written mainly in Borland C 3.1, with some
      graphics routines in x86 assembly language. It targets MS-DOS, VGA Mode 13h,
      keyboard and mouse input, and includes a MapEditor. The public source repository
      is available at https://github.com/NavaTron/CaveRace under the Apache-2.0
      license. Clemens also notes Windows and Windows Phone 7 versions written in C#
      with DirectX graphics.
    url: "https://caverace.com/"
    repo: "https://github.com/NavaTron/CaveRace"
  - name: Azure Maps MCP Server
    summary: >
      Clemens wrote about creating an Azure Maps MCP server that exposes geospatial
      capabilities to AI agents using Model Context Protocol. The project uses .NET,
      Azure Functions isolated worker, Azure Maps SDKs and REST APIs, and GitHub
      Copilot-assisted development.
    repo: "https://github.com/cschotte/azure-maps-mcp"
  - name: NavaTron Write
    summary: >
      NavaTron Write is a personal/open-source terminal word processor project in Zig.
      Add a public clemens.ms page and canonical repository link before citing detailed
      claims.
  - name: Zig and Raylib Experiments
    summary: >
      Clemens has public writing that mentions Zig as a language he uses for explicit
      control and predictable performance, including modernizing CaveRace in Zig. Add
      canonical public links for Raylib experiments if available.
  - name: GeoLibre
    summary: >
      GeoLibre is requested for inclusion, but no confirmed public clemens.ms page was
      identified in the local site content. Add details, repository, and status if
      GeoLibre is public.


canonical_summary: >
  Clemens Schotte is a Dutch software engineer, platform builder, technology leader, and
  founder of NavaTron B.V. He has 25+ years of experience across Microsoft technologies,
  .NET, Azure, enterprise software, SaaS platforms, product and program leadership,
  Business Central extensibility, geospatial systems, AI-assisted software development,
  and independent technical projects. His personal website, clemens.ms, is a technical
  blog and portfolio covering cloud platforms, Azure Maps, AI agents, software
  engineering, retro computing, game development, and practical technical notes.

bio: >
  Clemens Schotte is based in The Hague, Netherlands. He describes his work as operating
  at the intersection of product strategy, engineering, architecture, and business
  execution. His background spans software engineering, cloud architecture, product
  management, developer relations, technical consulting, and executive-level program
  leadership. His public biography states that he is a Dutch technology leader, software
  architect, and entrepreneur with 25+ years of experience building and delivering
  software products and platforms. After a long career at Microsoft, including
  leadership roles around Azure Maps, he now focuses on helping organizations improve
  processes through cloud technology, AI, and automation while continuing to pursue
  personal technology projects.

technical_expertise:
  - "Microsoft Azure, Azure Maps, Azure Functions, Azure AI Search, Azure OpenAI, Azure CDN, Azure Application Gateway, Azure Key Vault, and cloud-native architecture."
  - ".NET, C#, APIs, SaaS products, developer platforms, DevOps, Infrastructure as Code, and enterprise software delivery."
  - "Microsoft Dynamics 365 Business Central extensibility and productivity solutions."
  - "AI-assisted software development, Model Context Protocol (MCP), semantic search, n8n automation, and AI agents."
  - "Geospatial applications, routing, mapping, spatial analytics, logistics optimization, and IoT scenarios."
  - "Independent systems and game development interests including Zig, Raylib experiments, retro computing, MS-DOS, C, Amiga, and Commodore."


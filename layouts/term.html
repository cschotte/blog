{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ with .Content }}
<div class="post-body">{{ . }}</div>
{{ else with .Description }}
<div class="post-body"><p>{{ . }}</p></div>
{{ end }}

{{- $paginator := .Paginate .Pages -}}
<div class="post-list">
  {{- range $paginator.Pages }}
  {{ partial "article-card.html" . }}
  {{- end }}
</div>
{{ partial "pagination.html" (dict "Paginator" $paginator) }}
{{ end }}

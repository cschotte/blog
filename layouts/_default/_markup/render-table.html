<div class="table-wrap">
<table>
  {{- with .THead }}
  <thead>
    {{- range . }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }}{{ if ne . "none" }} style="text-align:{{ . }}"{{ end }}{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  {{- end }}
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }}{{ if ne . "none" }} style="text-align:{{ . }}"{{ end }}{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
